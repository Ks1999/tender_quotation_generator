<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quotation Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    --bg: oklch(0.984 0.004 255);
    --surface: oklch(1 0 0);
    --surface-2: oklch(0.973 0.006 255);
    --border: oklch(0.902 0.008 255);
    --border-strong: oklch(0.83 0.012 255);
    --text: oklch(0.24 0.02 260);
    --text-secondary: oklch(0.48 0.018 260);
    --text-tertiary: oklch(0.64 0.014 260);
    --accent: oklch(0.512 0.145 262);
    --accent-soft: oklch(0.94 0.03 262);
    --accent-soft-border: oklch(0.85 0.055 262);
    --success: oklch(0.6 0.13 152);
    --success-soft: oklch(0.955 0.045 152);
    --success-border: oklch(0.85 0.07 152);
    --warning: oklch(0.65 0.14 70);
    --warning-soft: oklch(0.96 0.05 70);
    --warning-border: oklch(0.85 0.09 70);
    --danger: oklch(0.58 0.18 25);
    --danger-soft: oklch(0.96 0.04 25);
    --danger-border: oklch(0.85 0.09 25);
    --neutral: oklch(0.5 0.01 260);
    --neutral-soft: oklch(0.94 0.006 260);
    --neutral-border: oklch(0.83 0.01 260);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: 'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  button { font-family: inherit; }
  input, textarea, select { font-family: inherit; }
  table { border-collapse: collapse; width: 100%; }
  th { text-align: left; font-size: 11.5px; font-weight: 700; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.03em; padding: 0 16px 10px 16px; }
  td { padding: 12px 16px; font-size: 13.5px; border-top: 1px solid var(--border); vertical-align: middle; }

  .btn-primary { background: var(--accent); color: white; border: none; border-radius: 9px; font-weight: 700; font-size: 14px; padding: 12px 24px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }

  .btn-primary:hover:not(:disabled) { filter: brightness(1.05); }
  .btn-outline { background: var(--surface); color: var(--accent); border: 1px solid var(--accent-soft-border); border-radius: 7px; font-weight: 600; font-size: 12.5px; padding: 7px 14px; cursor: pointer; }
  .btn-outline:hover { background: var(--accent-soft); }
  .btn-outline:disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }
  .btn-prev { background: var(--surface); color: var(--text-secondary); border: 1px solid var(--border-strong); border-radius: 9px; font-weight: 600; font-size: 14px; padding: 12px 20px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }

  .btn-prev:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-clear:hover { color: #c0392b; background: oklch(0.96 0.03 25); }
  .btn-export { background: var(--surface); color: var(--accent); border: 1.5px solid var(--accent); border-radius: 9px; font-weight: 700; font-size: 13.5px; padding: 11px 18px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
  .btn-export:hover { background: var(--accent-soft); }
  .btn-export:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-action { background: var(--surface); color: var(--text-secondary); border: 1px solid var(--border-strong); border-radius: 7px; font-weight: 600; font-size: 12.5px; padding: 7px 13px; cursor: pointer; }
  .btn-action:hover { background: var(--surface-2); }
  .btn-action-accent { background: var(--accent); color: white; border: none; border-radius: 7px; font-weight: 700; font-size: 12.5px; padding: 7px 13px; cursor: pointer; }
  .btn-action-danger { background: var(--danger-soft); color: var(--danger); border: 1px solid var(--danger-border); border-radius: 7px; font-weight: 700; font-size: 12.5px; padding: 7px 13px; cursor: pointer; }
  .btn-action-danger:hover { background: var(--danger); color: white; border-color: var(--danger); }

  .btn-sort-active { background: var(--accent-soft); color: var(--accent); }

'use strict';

/* ---- inlined XLSX writer (hand-written; no CDN/network access available for a real library) ---- */
(function () {
// ---------- CRC32 ----------
const CRC_TABLE = (function () {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) {
    c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  }
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function strToBytes(str) {
  return new TextEncoder().encode(str);
}

// ---------- ZIP (store method, no compression — simplest valid ZIP) ----------
function dosDateTime(date) {
  const time = ((date.getHours() & 0x1F) << 11) | ((date.getMinutes() & 0x3F) << 5) | ((date.getSeconds() / 2) & 0x1F);
  const dosDate = (((date.getFullYear() - 1980) & 0x7F) << 9) | (((date.getMonth() + 1) & 0xF) << 5) | (date.getDate() & 0x1F);
  return { time: time & 0xFFFF, date: dosDate & 0xFFFF };
}

function buildZip(files) {
  const now = new Date();
  const { time, date } = dosDateTime(now);
  const localParts = [];
  const centralParts = [];
  let offset = 0;

  for (const f of files) {
    const nameBytes = strToBytes(f.name);
    const data = f.data;
    const crc = crc32(data);
    const size = data.length;

    const local = new Uint8Array(30 + nameBytes.length);
    const lv = new DataView(local.buffer);
    lv.setUint32(0, 0x04034b50, true);
    lv.setUint16(4, 20, true);
    lv.setUint16(6, 0, true);
    lv.setUint16(8, 0, true);
    lv.setUint16(10, time, true);
    lv.setUint16(12, date, true);
    lv.setUint32(14, crc, true);
    lv.setUint32(18, size, true);
    lv.setUint32(22, size, true);
    lv.setUint16(26, nameBytes.length, true);
    lv.setUint16(28, 0, true);
    local.set(nameBytes, 30);

    localParts.push(local, data);

    const central = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(central.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, time, true);
    cv.setUint16(14, date, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, size, true);
    cv.setUint32(24, size, true);
    cv.setUint16(28, nameBytes.length, true);
    cv.setUint16(30, 0, true);
    cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true);
    cv.setUint16(36, 0, true);
    cv.setUint32(38, 0, true);
    cv.setUint32(42, offset, true);
    central.set(nameBytes, 46);

    centralParts.push(central);
    offset += local.length + data.length;
  }

  const centralSize = centralParts.reduce((a, p) => a + p.length, 0);
  const centralOffset = offset;

  const end = new Uint8Array(22);
  const ev = new DataView(end.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(4, 0, true);
  ev.setUint16(6, 0, true);
  ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true);
  ev.setUint32(12, centralSize, true);
  ev.setUint32(16, centralOffset, true);
  ev.setUint16(20, 0, true);

  const totalSize = offset + centralSize + end.length;
  const out = new Uint8Array(totalSize);
  let pos = 0;
  for (const part of localParts) { out.set(part, pos); pos += part.length; }
  for (const part of centralParts) { out.set(part, pos); pos += part.length; }
  out.set(end, pos);
  return out;
}

// ---------- Minimal OOXML spreadsheet ----------
function xmlEscape(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&apos;');
}

function colLetter(n) {
  let s = '';
  while (n > 0) {
    const rem = (n - 1) % 26;
    s = String.fromCharCode(65 + rem) + s;
    n = Math.floor((n - 1) / 26);
  }
  return s;
}

function cellXml(colIdx, rowIdx, value) {
  const ref = colLetter(colIdx) + rowIdx;
  if (value === null || value === undefined || value === '') {
    return '';
  }
  if (typeof value === 'number' && isFinite(value)) {
    return '<c r="' + ref + '"><v>' + value + '</v></c>';
  }
  return '<c r="' + ref + '" t="inlineStr"><is><t xml:space="preserve">' + xmlEscape(value) + '</t></is></c>';
}

function buildXlsx(rows, sheetName) {
  sheetName = sheetName || 'Sheet1';
  const rowsXml = rows.map(function (row, ri) {
    const cells = row.map(function (val, ci) { return cellXml(ci + 1, ri + 1, val); }).join('');
    return '<row r="' + (ri + 1) + '">' + cells + '</row>';
  }).join('');

  const maxCols = rows.reduce(function (m, r) { return Math.max(m, r.length); }, 1);
  const dimensionRef = 'A1:' + colLetter(maxCols) + rows.length;

  const sheetXml =
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<dimension ref="' + dimensionRef + '"/>' +
    '<sheetData>' + rowsXml + '</sheetData>' +
    '</worksheet>';

  const contentTypesXml =
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="xml" ContentType="application/xml"/>' +
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
    '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
    '</Types>';

  const rootRelsXml =
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
    '</Relationships>';

  const workbookXml =
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
    '<sheets><sheet name="' + xmlEscape(sheetName) + '" sheetId="1" r:id="rId1"/></sheets>' +
    '</workbook>';

  const workbookRelsXml =
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>' +
    '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
    '</Relationships>';

  const stylesXml =
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<fonts count="1"><font><sz val="11"/><name val="Calibri"/></font></fonts>' +
    '<fills count="1"><fill><patternFill patternType="none"/></fill></fills>' +
    '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
    '<cellXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/></cellXfs>' +
    '</styleSheet>';

  const files = [
    { name: '[Content_Types].xml', data: strToBytes(contentTypesXml) },
    { name: '_rels/.rels', data: strToBytes(rootRelsXml) },
    { name: 'xl/workbook.xml', data: strToBytes(workbookXml) },
    { name: 'xl/_rels/workbook.xml.rels', data: strToBytes(workbookRelsXml) },
    { name: 'xl/styles.xml', data: strToBytes(stylesXml) },
    { name: 'xl/worksheets/sheet1.xml', data: strToBytes(sheetXml) }
  ];

  return buildZip(files);
}

window.buildXlsx = buildXlsx;
})();
/* ---- end inlined XLSX writer ---- */

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function money(n) {
  n = Number(n) || 0;
  return 'RM ' + n.toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function productByModel(model) {
  if (!model) return null;
  for (var i = 0; i < PRODUCTS.length; i++) { if (PRODUCTS[i].model === model) return PRODUCTS[i]; }
  return null;
}
function customerByAccountCode(code) {
  if (!code) return null;
  for (var i = 0; i < CUSTOMERS.length; i++) { if (CUSTOMERS[i].accountCode === code) return CUSTOMERS[i]; }
  return null;
}
// Resolves state.selectedCustomerCodes (account codes) to full customer
// objects, in the same order they were selected. Silently drops any code
// that no longer matches a customer (shouldn't normally happen).
function getSelectedCustomers() {
  return state.selectedCustomerCodes.map(customerByAccountCode).filter(function (c) { return !!c; });
}
// Short label for a set of selected customers, used in buttons/headers:
// one name spelled out, two joined with "and", three or more as a count.
function describeCustomerList(customers) {
  if (customers.length === 0) return '';
  if (customers.length === 1) return customers[0].name;
  if (customers.length === 2) return customers[0].name + ' and ' + customers[1].name;
  return customers.length + ' customers';
}
// Turns a spec item's raw extracted description into a starting guess for the
// product-catalog search box, so opening the search panel already shows
// relevant candidates instead of the default top-6 list. Strips one narrow,
// well-evidenced piece of noise: a "Jenama <Brand> atau Setara" clause (Malay
// for "<Brand> brand or equivalent") that shows up consistently across real
// GOH tender specs (see sku_matching_corrections.md) as a qualifier, never as
// part of the actual product name — removing just the "Jenama"/"atau Setara"
// connector words keeps the brand name itself (still a useful search term)
// while dropping text that never helps match against the English-language
// catalog. Deliberately narrow: it only fires on this exact Malay idiom, so
// it can't accidentally eat a real product name it doesn't recognize.
function guessSearchQuery(it) {
  var raw = String((it && it.description) || '').trim();
  if (!raw) return '';
  var cleaned = raw
    .replace(/\bJenama\s+[^()\n]*?\s+atau\s+Setara?\b/gi, '')
    .replace(/\(\s*\)/g, ' ')
    .replace(/\s{2,}/g, ' ')
    .replace(/\s+([),.;:])/g, '$1')
    .trim();
  return cleaned || raw;
}
function searchProducts(q) {
  var query = (q || '').trim().toLowerCase();
  if (!query) return PRODUCTS.slice(0, 6);
  var words = query.split(/\s+/).filter(function (w) { return w.length > 0; });
  var scored = [];
  for (var i = 0; i < PRODUCTS.length; i++) {
    var p = PRODUCTS[i];
    var hay = (p.name + ' ' + p.model + ' ' + p.manufacturer + ' ' + p.categories).toLowerCase();
    var score = 0;
    if (hay.indexOf(query) !== -1) score = 100;
    else {
      var allPresent = true;
      var anyPresentCount = 0;
      for (var w = 0; w < words.length; w++) {
        if (hay.indexOf(words[w]) !== -1) anyPresentCount++; else allPresent = false;
      }
      if (allPresent && words.length > 0) score = 30;
      else if (anyPresentCount > 0) score = 10 + anyPresentCount; // partial word match — weaker, still surfaced
    }
    if (score > 0) scored.push({ p: p, score: score });
  }
  scored.sort(function (a, b) { return b.score - a.score; });
  var out = [];
  for (var j = 0; j < scored.length && j < 8; j++) out.push(scored[j].p);
  return out;
}
function filterCustomers(query) {
  var q = (query || '').trim().toLowerCase();
  if (!q) return CUSTOMERS;
  var words = q.split(/\s+/).filter(function (w) { return w.length > 0; });
  return CUSTOMERS.filter(function (c) {
    var hay = (c.name + ' ' + c.accountCode + ' ' + c.city + ' ' + c.state + ' ' + (c.contactFirstName || '')).toLowerCase();
    return words.every(function (w) { return hay.indexOf(w) !== -1; });
  });
}

   synced anywhere. Wrapped in try/catch since some contexts (private

var CONTRIBUTOR_NAME_KEY = 'quotationStudio.contributorName';
function loadStoredContributorName() {
  try { return localStorage.getItem(CONTRIBUTOR_NAME_KEY) || ''; } catch (e) { return ''; }
}
function saveStoredContributorName(name) {
  try { localStorage.setItem(CONTRIBUTOR_NAME_KEY, name); } catch (e) { /* ignore — not fatal */ }
}

var state = {
  step: 1,
  items: [],
  sourceFileName: '',
  importError: '',
  // Account codes of the selected customers, in the order they were picked.
  // One quotation Row No. is generated per entry here, in this order — see
  // doDownloadQuotation().
  selectedCustomerCodes: [],
  customerSearch: '',
  customerPage: 1,
  customerPageSize: 8,
  reviewSortMode: 'status',
  reviewSortOrder: [],
  reviewSearch: '',
  reviewPage: 1,
  reviewPageSize: 25,
  // One-shot: set to an item id right after that item's search panel opens, so
  // render() can focus its newly-created .item-search-input without the user
  // having to click it first. Cleared by render() the very next time it runs.
  pendingFocusId: null,
  comment: '',
  fileDragActive: false,
  contributorName: loadStoredContributorName(),
  // Auto-open the "what should we call you" modal only when there is no name on
  // record for this browser yet — first-ever visit, or the record was cleared
  // (cookies/storage wiped, private browsing, etc). Once a name is saved it will
  // not pop up on its own again; it can still be reopened from the header.
  userMenuOpen: !loadStoredContributorName().trim(),
  toast: ''
};

function normalizeImportedItems(raw) {
  return raw.map(function (row) {
    return {
      rowId: row.rowId,
      description: row.description,
      qty: row.qty,
      uom: row.uom,
      status: row.status,
      matchedSku: row.matchedSku || null,
      notes: row.notes || '',
      // runtime-only fields:
      id: 'r' + row.rowId,
      note: row.notes || '',
      open: false,
      query: '',
      originalStatus: row.status,
      originalMatchedSku: row.matchedSku || null
    };
  });
}

function loadItems(rawItems, fileName) {
  state.items = normalizeImportedItems(rawItems);
  state.sourceFileName = fileName;
  state.importError = '';
  recomputeSortOrder();
}

function recomputeSortOrder() {
  var items = state.items.slice();
  var mode = state.reviewSortMode;
  if (mode === 'name') {
    items.sort(function (a, b) { return String(a.description).localeCompare(String(b.description)); });
  } else if (mode === 'model') {
    items.sort(function (a, b) { return String(a.matchedSku || '').localeCompare(String(b.matchedSku || '')); });
  } else if (mode === 'status') {
    // Needs-review-first: nomatch and review need attention, so they sort ahead of
    // not_carried and matched. Note: rank values include 0, so a `|| fallback` would
    // wrongly treat nomatch's rank of 0 as falsy — use an explicit `in` check instead.
    var rank = { nomatch: 0, review: 1, not_carried: 2, matched: 3 };
    var rankOf = function (status) { return (status in rank) ? rank[status] : 9; };
    items.sort(function (a, b) { return rankOf(a.status) - rankOf(b.status); });
  } else {
    items.sort(function (a, b) { return a.rowId - b.rowId; });
  }
  state.reviewSortOrder = items.map(function (it) { return it.id; });
}

function itemById(id) {
  for (var i = 0; i < state.items.length; i++) { if (state.items[i].id === id) return state.items[i]; }
  return null;
}

function getCorrectedItems() {
  return state.items.filter(function (it) {
    return it.status !== it.originalStatus || it.matchedSku !== it.originalMatchedSku;
  });
}

// Review Matches search: looks at the item's own description (the product name
// as it came from the spec) plus, once matched, the catalog product's name and
// its SKU/model — so searching either "stapler" or a model number like
// "B07TEST1" finds the right row.
function reviewItemMatchesQuery(it, query) {
  var q = String(query || '').trim().toLowerCase();
  if (!q) return true;
  var matched = productByModel(it.matchedSku);
  var haystack = (
    (it.description || '') + ' ' +
    (it.matchedSku || '') + ' ' +
    (matched ? matched.name : '') + ' ' +
    (matched ? matched.model : '')
  ).toLowerCase();
  return haystack.indexOf(q) !== -1;
}

/* =========================================================================
   RENDER — SHELL (header + step rail + toast)
   ========================================================================= */
var STEP_NAMES = ['Upload Spec', 'Select Customer', 'Review Matches', 'Comments', 'Generate'];

function renderStepRail() {
  var html = '';
  for (var i = 1; i <= 5; i++) {
    var cls, dotCls;
    if (i === state.step) { cls = 'step-label-active'; dotCls = 'step-dot-active'; }
    else if (i < state.step) { cls = 'step-label-inactive'; dotCls = 'step-dot-done'; }
    else { cls = 'step-label-inactive'; dotCls = 'step-dot-pending'; }
    var dotContent = (i < state.step)
      ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'
      : String(i);
    html += '<button class="step-rail-item" data-action="goto-step" data-step="' + i + '">' +
      '<div class="step-dot ' + dotCls + '">' + dotContent + '</div>' +
      '<span class="' + cls + '">' + STEP_NAMES[i - 1] + '</span>' +
      '</button>';
    if (i < 5) {
      var connBg = i < state.step ? 'var(--accent)' : 'var(--border)';
      html += '<div class="step-connector" style="background:' + connBg + ';"></div>';
    }
  }
  return html;
}

/* =========================================================================

    '<div>' +
      '<div style="max-width:640px;">' +
        '<div style="margin-bottom:24px;">' +
          '<h1 style="font-size:22px; font-weight:800; margin:0 0 6px 0; letter-spacing:-0.01em;">New quotation</h1>' +
          '<p style="font-size:14px; color:var(--text-secondary); margin:0;">A spec PDF never comes in here directly. Run it through the <span style="font-family:monospace;">goh-sku-extractor</span> skill in a Claude session first, then import the <span style="font-family:monospace;">extracted_items.json</span> it produces.</p>' +

            '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4.6 4.4 0 0 1-1.242-8.99 4.5 4.5 0 0 1 8.965-1.686A4.6 4.6 0 0 1 17.5 18"/><path d="M12 12v9"/><path d="m9.5 14.5 2.5-2.5 2.5 2.5"/></svg>' +
          '</div>' +
          '<div style="pointer-events:none;">' +
            '<p style="font-size:15px; font-weight:700; margin:0 0 4px 0;">' + (state.fileDragActive ? 'Drop to import' : 'Click or drag &amp; drop extracted_items.json here') + '</p>' +

/* =========================================================================

  var pageEnd = Math.min(startIdx + pageSize, totalCount);

  var rowsHtml = pageCustomers.map(function (c) {

        '<td style="border-top:none; width:1%;">' +

            (isSelected ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>' : '') +

            '<p style="margin:2px 0 0 0; font-size:12px; color:var(--text-tertiary);">' + escapeHtml(c.address) + '</p>' +
          '</div>' +
        '</td>' +
        '<td style="border-top:none; color:var(--text-secondary);">' + escapeHtml(c.accountCode) + '</td>' +
        '<td style="border-top:none; color:var(--text-secondary);">' + escapeHtml(c.city) + '</td>' +
        '<td style="border-top:none; color:var(--text-secondary);">' + escapeHtml(c.state) + '</td>' +
        '<td style="border-top:none; color:var(--text-secondary);">' + escapeHtml(c.contactFirstName || '—') + '</td>' +

  var noResultsRow = totalCount === 0

    : '';

  var itemCountLine = state.items.length
    ? 'Extracted ' + state.items.length + ' item' + (state.items.length === 1 ? '' : 's') + ' from <strong style="color:var(--text);">' + escapeHtml(state.sourceFileName) + '</strong>. '
    : '';

  var selectedChipsHtml = selectedCustomers.length
    ? (
      '<div style="background:var(--accent-soft); border:1px solid var(--accent-soft-border); border-radius:12px; padding:14px 16px; margin-bottom:16px;">' +
        '<p style="margin:0 0 10px 0; font-size:12.5px; font-weight:700; color:var(--accent);">' + selectedCustomers.length + ' customer' + (selectedCustomers.length === 1 ? '' : 's') + ' selected — each will get its own quotation row when generated</p>' +
        '<div style="display:flex; flex-wrap:wrap; gap:8px;">' +
          selectedCustomers.map(function (c) {
            return (
              '<span style="display:inline-flex; align-items:center; gap:7px; background:var(--surface); border:1px solid var(--accent-soft-border); border-radius:999px; padding:6px 8px 6px 12px; font-size:12.5px; font-weight:600; color:var(--text);">' +
                escapeHtml(c.name) +
                '<button data-action="remove-customer" data-code="' + escapeHtml(c.accountCode) + '" aria-label="Remove ' + escapeHtml(c.name) + '" style="background:var(--surface-2); border:none; border-radius:999px; width:18px; height:18px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-tertiary); padding:0;"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>' +
              '</span>'
            );
          }).join('') +
        '</div>' +
      '</div>'
    )
    : '';

  return (
    '<div style="margin-bottom:22px;">' +
      '<h1 style="font-size:22px; font-weight:800; margin:0 0 6px 0; letter-spacing:-0.01em;">Who is this quotation for?</h1>' +

      '<input type="text" id="customerSearchInput" value="' + escapeHtml(state.customerSearch) + '" placeholder="Search by customer name, account code, or city&hellip;" style="width:100%; padding:13px 16px 13px 44px; font-size:14px; border:1px solid var(--border-strong); border-radius:10px; background:var(--surface); color:var(--text); outline:none;">' +

        '<th style="padding-top:14px;"></th><th style="padding-top:14px;">Customer</th><th style="padding-top:14px;">Account Code</th><th style="padding-top:14px;">City</th><th style="padding-top:14px;">State</th><th style="padding-top:14px;">Contact</th>' +

    '<div style="display:flex; align-items:center; justify-content:space-between; margin-top:18px;">' +
      '<span style="font-size:12.5px; color:var(--text-tertiary);">' + (totalCount === 0 ? 'No matching customers' : ('Showing ' + pageStart + '–' + pageEnd + ' of ' + totalCount + ' customers')) + '</span>' +
      '<div style="display:flex; align-items:center; gap:8px;">' +
        '<button class="btn-outline" data-action="customer-prev-page" ' + (currentPage <= 1 ? 'disabled' : '') + '>Previous</button>' +
        '<span style="font-size:12.5px; color:var(--text-secondary); padding:0 6px;">Page ' + currentPage + ' of ' + totalPages + '</span>' +
        '<button class="btn-outline" data-action="customer-next-page" ' + (currentPage >= totalPages ? 'disabled' : '') + '>Next</button>' +
      '</div>' +
    '</div>' +

    '<p style="font-size:11.5px; color:var(--text-tertiary); margin:16px 0 0 0; text-align:center;">' + CUSTOMERS.length + ' customers loaded from the GOH customer master list.</p>' +

    '<div style="display:flex; justify-content:space-between; align-items:center; margin-top:32px; padding-top:24px; border-top:1px solid var(--border);">' +
      '<button class="btn-prev" data-action="prev-step"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>Previous</button>' +

      '</button>' +
    '</div>'
  );

/* =========================================================================
   STEP 3 — Review Matches
   ========================================================================= */
var STATUS_META = {
  matched:     { bg: 'var(--success-soft)', color: 'var(--success)', border: 'var(--success-border)', label: 'Matched' },
  review:      { bg: 'var(--warning-soft)', color: 'var(--warning)', border: 'var(--warning-border)', label: 'Review' },
  nomatch:     { bg: 'var(--danger-soft)',  color: 'var(--danger)',  border: 'var(--danger-border)',  label: 'No match' },
  not_carried: { bg: 'var(--neutral-soft)', color: 'var(--neutral)', border: 'var(--neutral-border)', label: 'Not carried' }
};

function renderReviewItemRow(it) {
  var meta = STATUS_META[it.status] || STATUS_META.nomatch;
  var match = productByModel(it.matchedSku);
  var actionLabel = it.status === 'matched' ? 'Change' : (it.status === 'review' ? 'Confirm' : (it.status === 'not_carried' ? 'Search' : 'Search'));
  var isUrgent = it.status === 'nomatch';
  // For a 'review' item the flagged candidate is already sitting in it.matchedSku —
  // "Confirm" accepts that candidate outright (one click), with a smaller "Change"
  // link alongside it to open the search panel if the candidate is wrong. A
  // 'nomatch' item gets the same two-button treatment: "Search" (opens the
  // panel) alongside "Mark as not carried" (skips straight to that outcome
  // without opening the panel first — the same action the panel itself offers
  // once opened). Every other status keeps a single button that opens the
  // search panel.
  var isReviewWithCandidate = it.status === 'review' && !!match;

  var matchLine = match
    ? '<p style="margin:4px 0 0 0; font-size:13px; color:var(--text-secondary);"><strong style="color:var(--text);">' + escapeHtml(match.model) + '</strong> &mdash; ' + escapeHtml(match.name) + ' &middot; ' + money(match.price) + '</p>'
    : (it.status === 'not_carried' ? '<p style="margin:4px 0 0 0; font-size:13px; color:var(--text-tertiary); font-style:italic;">Marked as not carried.</p>' : '');

  var noteLine = it.note
    ? '<p style="margin:6px 0 0 0; font-size:12px; color:var(--text-tertiary); line-height:1.4;">' + escapeHtml(it.note) + '</p>'
    : '';

  var panel = '';
  if (it.open) {
    var results = searchProducts(it.query);
    var resultsHtml = results.length
      ? results.map(function (p) {
          var isSel = match && match.model === p.model;
          return (
            '<div class="alt-row" style="display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 12px; border:1px solid ' + (isSel ? 'var(--accent-soft-border)' : 'var(--border)') + '; background:' + (isSel ? 'var(--accent-soft)' : 'var(--surface)') + '; border-radius:8px; margin-bottom:6px; cursor:pointer;" data-action="pick-result" data-id="' + it.id + '" data-model="' + escapeHtml(p.model) + '">' +
              '<div>' +
                '<p style="margin:0; font-size:13px; font-weight:600;">' + escapeHtml(p.name) + (p.manufacturer ? ' <span style="color:var(--text-tertiary); font-weight:500;">(' + escapeHtml(p.manufacturer) + ')</span>' : '') + '</p>' +
                '<p style="margin:2px 0 0 0; font-size:12px; color:var(--text-tertiary);">' + escapeHtml(p.model) + ' &middot; ' + money(p.price) + '</p>' +
              '</div>' +
              (isSel ? '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent); flex-shrink:0;"><path d="M20 6 9 17l-5-5"/></svg>' : '') +
            '</div>'
          );
        }).join('')
      : '<p style="font-size:13px; color:var(--text-tertiary); padding:10px 0;">No matching products found in the catalog.</p>';

    panel =
      '<div style="margin-top:14px; padding-top:14px; border-top:1px solid var(--border);">' +
        '<input type="text" class="item-search-input" data-id="' + it.id + '" value="' + escapeHtml(it.query) + '" placeholder="Search the product catalog&hellip;" style="width:100%; padding:10px 14px; font-size:13.5px; border:1px solid var(--border-strong); border-radius:8px; outline:none; margin-bottom:10px;">' +
        resultsHtml +
        '<div style="display:flex; justify-content:flex-end; gap:8px; margin-top:8px;">' +
          '<button class="btn-action-danger" style="flex-shrink:0;" data-action="mark-not-carried" data-id="' + it.id + '">Mark as not carried</button>' +
          '<button class="btn-action" data-action="cancel-open" data-id="' + it.id + '">Cancel</button>' +
        '</div>' +
      '</div>';
  }

  return (
    '<div style="background:var(--surface); border:1px solid var(--border); border-left:3px solid ' + meta.color + '; border-radius:12px; padding:16px 20px; margin-bottom:10px;">' +
      '<div style="display:flex; align-items:flex-start; justify-content:space-between; gap:16px;">' +
        '<div style="flex:1; min-width:0;">' +
          '<div style="display:flex; align-items:center; gap:10px;">' +
            '<span style="font-size:11.5px; font-weight:700; color:var(--text-tertiary);">#' + it.rowId + '</span>' +
            '<span class="badge" style="background:' + meta.bg + '; color:' + meta.color + '; border:1px solid ' + meta.border + ';">' + meta.label + '</span>' +
          '</div>' +
          '<p style="margin:6px 0 0 0; font-size:14.5px; font-weight:600;">' + escapeHtml(it.description) + '</p>' +
          '<p style="margin:3px 0 0 0; font-size:12.5px; color:var(--text-tertiary);">Qty ' + escapeHtml(it.qty) + ' ' + escapeHtml(it.uom) + '</p>' +
          matchLine + noteLine +
        '</div>' +
        (isReviewWithCandidate
          ? '<div style="display:flex; flex-direction:column; gap:6px; align-items:stretch; flex-shrink:0;">' +
              '<button class="btn-action-accent" data-action="confirm-candidate" data-id="' + it.id + '">Confirm</button>' +
              '<button class="btn-action" style="font-size:12px; padding:6px 14px;" data-action="toggle-open" data-id="' + it.id + '">Change</button>' +
            '</div>'
          : isUrgent
            ? '<div style="display:flex; flex-direction:column; gap:6px; align-items:stretch; flex-shrink:0;">' +
                '<button class="btn-action-accent" data-action="toggle-open" data-id="' + it.id + '">' + actionLabel + '</button>' +
                '<button class="btn-action-danger" style="font-size:12px; padding:6px 14px;" data-action="mark-not-carried" data-id="' + it.id + '">Mark as not carried</button>' +
              '</div>'
            : '<button class="btn-action" style="flex-shrink:0;" data-action="toggle-open" data-id="' + it.id + '">' + actionLabel + '</button>') +
      '</div>' +
      panel +
    '</div>'
  );
}

function renderStep3() {
  if (state.items.length === 0) {
    return (
      '<div style="text-align:center; padding:80px 0;">' +
        '<p style="font-size:15px; font-weight:700; margin:0 0 8px 0;">Nothing to review yet</p>' +
        '<p style="font-size:13.5px; color:var(--text-tertiary); margin:0 0 20px 0;">Go back and import an extracted_items.json file, or load the sample data.</p>' +
        '<button class="btn-prev" data-action="goto-step" data-step="1" style="display:inline-flex;">Back to Upload Spec</button>' +
      '</div>'
    );
  }

  var itemsById = {};
  state.items.forEach(function (it) { itemsById[it.id] = it; });
  var ordered = state.reviewSortOrder.map(function (id) { return itemsById[id]; }).filter(Boolean);

  // Find-in-list search: filters the (already sorted) review list by the spec's
  // product name/description or, once matched, the catalog product name/SKU.
  // This is separate from the per-item "search the product catalog" box inside
  // an open row — this one narrows which rows show up at all.
  var searchQuery = (state.reviewSearch || '').trim();
  var searched = searchQuery ? ordered.filter(function (it) { return reviewItemMatchesQuery(it, searchQuery); }) : ordered;

  var totalCount = searched.length;
  var pageSize = state.reviewPageSize;
  var totalPages = Math.max(1, Math.ceil(totalCount / pageSize));
  var currentPage = Math.max(1, Math.min(state.reviewPage, totalPages));
  var startIdx = (currentPage - 1) * pageSize;
  var pageItems = searched.slice(startIdx, startIdx + pageSize);

  var matchedCount = state.items.filter(function (i) { return i.status === 'matched'; }).length;
  var reviewCount = state.items.filter(function (i) { return i.status === 'review'; }).length;
  var nomatchCount = state.items.filter(function (i) { return i.status === 'nomatch'; }).length;
  var notCarriedCount = state.items.filter(function (i) { return i.status === 'not_carried'; }).length;
  var attention = reviewCount + nomatchCount;

  var bannerHtml = attention > 0
    ? '<div style="background:var(--warning-soft); border:1px solid var(--warning-border); border-radius:12px; padding:14px 18px; margin-bottom:20px; font-size:13.5px; color:var(--text); font-weight:600;">' + attention + ' item' + (attention === 1 ? '' : 's') + ' need your attention before this quotation can be generated &mdash; confirm the matches below or search for a product.</div>'
    : '<div style="background:var(--success-soft); border:1px solid var(--success-border); border-radius:12px; padding:14px 18px; margin-bottom:20px; font-size:13.5px; color:var(--text); font-weight:600;">All items matched. Ready to continue.</div>';

  function sortBtn(mode, label) {
    var isActive = state.reviewSortMode === mode;
    var cls = 'btn-sort' + (isActive ? ' btn-sort-active' : '');
    // The "needs review" sort doubles as a status indicator: while any items still
    // need review it's highlighted yellow (whether or not it's the active sort),
    // as a nudge to switch to it; once nothing needs review it drops back to the
    // normal active/inactive button styling.
    var extraStyle = (mode === 'status' && attention > 0)
      ? ' style="background:var(--warning-soft); color:var(--warning); border:1px solid var(--warning-border); font-weight:700;"'
      : '';
    return '<button class="' + cls + '"' + extraStyle + ' data-action="set-sort" data-mode="' + mode + '">' + label + '</button>';
  }

  return (
    '<div style="margin-bottom:8px; display:flex; align-items:center; justify-content:space-between;">' +
      '<div>' +
        '<h1 style="font-size:22px; font-weight:800; margin:0 0 6px 0; letter-spacing:-0.01em;">Review matches</h1>' +
        '<p style="font-size:14px; color:var(--text-secondary); margin:0;">Matching items from <strong style="color:var(--text);">' + escapeHtml(state.sourceFileName || 'your import') + '</strong> for <strong style="color:var(--text);">' + escapeHtml(describeCustomerList(getSelectedCustomers()) || 'no customer selected') + '</strong></p>' +
      '</div>' +
    '</div>' +

    '<div style="margin:18px 0;">' + bannerHtml + '</div>' +

    '<div style="position:relative; margin-bottom:14px;">' +
      '<div style="position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--text-tertiary); pointer-events:none;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></div>' +
      '<input type="text" id="reviewSearchInput" value="' + escapeHtml(state.reviewSearch) + '" placeholder="Find an item by product name or SKU&hellip;" style="width:100%; padding:11px 36px 11px 40px; font-size:13.5px; border:1px solid var(--border-strong); border-radius:10px; background:var(--surface); color:var(--text); outline:none; box-sizing:border-box;">' +
      (searchQuery
        ? '<button data-action="clear-review-search" title="Clear search" style="position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--text-tertiary); padding:4px; display:flex;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>'
        : '') +
    '</div>' +

    '<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">' +
      '<div style="display:flex; align-items:center; gap:4px;">' + sortBtn('status', 'Needs review first (default)') + sortBtn('rowid', 'Spec order') + sortBtn('name', 'Product name') + sortBtn('model', 'Model') + '</div>' +
      '<span style="font-size:12px; color:var(--text-tertiary);">' + matchedCount + ' matched &middot; ' + reviewCount + ' review &middot; ' + nomatchCount + ' no match' + (notCarriedCount ? (' &middot; ' + notCarriedCount + ' not carried') : '') + '</span>' +
    '</div>' +

    (pageItems.length
      ? pageItems.map(renderReviewItemRow).join('')
      : '<div style="text-align:center; padding:48px 0; color:var(--text-tertiary); font-size:13.5px;">No items match &ldquo;' + escapeHtml(searchQuery) + '&rdquo;. <button data-action="clear-review-search" style="background:none; border:none; color:var(--accent); font-weight:600; cursor:pointer; padding:0; font-size:13.5px; text-decoration:underline;">Clear search</button></div>') +

    '<div style="display:flex; align-items:center; justify-content:space-between; margin-top:8px;">' +
      '<span style="font-size:12.5px; color:var(--text-tertiary);">' + (totalCount === 0 ? 'No matching items' : ('Showing ' + (startIdx + 1) + '–' + Math.min(startIdx + pageSize, totalCount) + ' of ' + totalCount + (searchQuery ? (' (' + state.items.length + ' total)') : ''))) + '</span>' +
      '<div style="display:flex; align-items:center; gap:8px;">' +
        '<button class="btn-outline" data-action="review-prev-page" ' + (currentPage <= 1 ? 'disabled' : '') + '>Previous</button>' +
        '<span style="font-size:12.5px; color:var(--text-secondary); padding:0 6px;">Page ' + currentPage + ' of ' + totalPages + '</span>' +
        '<button class="btn-outline" data-action="review-next-page" ' + (currentPage >= totalPages ? 'disabled' : '') + '>Next</button>' +
      '</div>' +
    '</div>' +

    '<div style="display:flex; justify-content:space-between; align-items:center; margin-top:32px; padding-top:24px; border-top:1px solid var(--border);">' +
      '<button class="btn-prev" data-action="prev-step"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>Previous</button>' +
      '<button class="btn-primary" data-action="next-step" ' + (attention > 0 ? 'disabled' : '') + '>' + (attention > 0 ? attention + ' item' + (attention === 1 ? '' : 's') + ' still need review' : 'Continue to Comments') +
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>' +
      '</button>' +
    '</div>'
  );
}

/* =========================================================================
   STEP 4 — Comments
   ========================================================================= */
function renderStep4() {
  var len = (state.comment || '').length;
  return (
    '<div style="margin-bottom:8px; display:flex; align-items:center; gap:10px;">' +
      '<h1 style="font-size:22px; font-weight:800; margin:0; letter-spacing:-0.01em;">Add a comment</h1>' +
      '<span style="font-size:11.5px; font-weight:700; color:var(--text-tertiary); background:var(--surface-2); border:1px solid var(--border); padding:3px 10px; border-radius:999px;">Optional</span>' +
    '</div>' +
    '<p style="font-size:14px; color:var(--text-secondary); margin:0 0 24px 0;">Anything you write here is copied exactly, word for word, into the <strong style="color:var(--text);">Comment</strong> column for <strong style="color:var(--text);">' + escapeHtml(describeCustomerList(getSelectedCustomers()) || 'the selected customer') + '</strong> &mdash; no reformatting or summarizing. The same comment is applied to every customer&rsquo;s quotation row.</p>' +

    '<div style="background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:22px;">' +
      '<label style="display:block; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; color:var(--text-tertiary); margin-bottom:10px;">Comment</label>' +
      '<textarea id="commentBox" rows="9" maxlength="2000" placeholder="e.g. delivery instructions, special pricing notes, internal remarks&hellip;" style="width:100%; border:1px solid var(--border-strong); border-radius:10px; padding:14px 16px; font-size:14px; line-height:1.6; color:var(--text); outline:none; background:var(--surface);">' + escapeHtml(state.comment) + '</textarea>' +
      '<div style="display:flex; align-items:center; justify-content:space-between; margin-top:10px;">' +
        '<span style="font-size:12px; color:var(--text-tertiary);">Leave this blank and continue to skip &mdash; nothing will be added to the Comment column.</span>' +
        '<span style="font-size:12px; color:var(--text-tertiary);">' + len + ' / 2000</span>' +
      '</div>' +
    '</div>' +

    '<div style="display:flex; justify-content:space-between; align-items:center; margin-top:28px; padding-top:24px; border-top:1px solid var(--border);">' +
      '<button class="btn-prev" data-action="prev-step"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>Previous</button>' +
      '<button class="btn-primary" data-action="next-step">Continue to summary<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>' +
    '</div>'
  );
}

/* =========================================================================
   STEP 5 — Summary / Generate
   ========================================================================= */
function computeLineItems() {
  return state.items
    .filter(function (it) { return it.status !== 'not_carried' && it.status !== 'nomatch' && it.matchedSku; })
    .map(function (it) {
      var p = productByModel(it.matchedSku);
      return {
        it: it,
        model: it.matchedSku,
        name: p ? p.name : it.matchedSku,
        qty: Number(it.qty) || 0,
        price: p ? p.price : 0,
        // Price 3 (MYR) from the Product List Report — what goes into the
        // exported quotation's Unit Price column (Standard Price is shown to
        // the reviewer while matching, but is never exported; see
        // quotation_field_rules.md).
        price3: p ? p.price3 : 0
      };
    });
}

function renderStep5() {
  var lineItems = computeLineItems();
  var excludedCount = state.items.length - lineItems.length;
  var corrected = getCorrectedItems();
  var selectedCustomers = getSelectedCustomers();
  var canGenerate = selectedCustomers.length > 0 && lineItems.length > 0;

  var lineItemsHtml = lineItems.map(function (li) {
    return (
      '<tr>' +
        '<td>' + escapeHtml(li.model) + '</td>' +
        '<td>' + escapeHtml(li.name) + '</td>' +
        '<td style="text-align:right;">' + li.qty + '</td>' +
      '</tr>'
    );
  }).join('');

  var customerCard = selectedCustomers.length
    ? (
      '<div style="display:flex; flex-direction:column; gap:12px; max-height:340px; overflow-y:auto;">' +
        selectedCustomers.map(function (cust) {
          return (
            '<div style="background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 18px;">' +
              '<p style="margin:0 0 4px 0; font-size:14.5px; font-weight:700;">' + escapeHtml(cust.name) + '</p>' +
              '<p style="margin:0; font-size:12.5px; color:var(--text-secondary); line-height:1.6;">' +
                escapeHtml(cust.address) + '<br>' +
                escapeHtml(cust.city) + ', ' + escapeHtml(cust.state) + ' ' + escapeHtml(cust.postcode) + '<br>' +
                escapeHtml(cust.country) +
              '</p>' +
              '<p style="margin:10px 0 0 0; font-size:12.5px; color:var(--text-tertiary);">Account ' + escapeHtml(cust.accountCode) + (cust.contactFirstName ? (' &middot; Attn: ' + escapeHtml(cust.contactFirstName)) : '') + (cust.email ? (' &middot; ' + escapeHtml(cust.email)) : '') + (cust.phone ? (' &middot; ' + escapeHtml(cust.phone)) : '') + '</p>' +
              (!cust.email
                ? '<p style="margin:10px 0 0 0; padding:8px 10px; background:var(--warning-soft); border:1px solid var(--warning-border); border-radius:7px; font-size:12px; color:var(--text);"><strong>No email on file</strong> for this customer &mdash; Email is a required field for import. Fill it in on the generated file before submitting.</p>'
                : '') +
            '</div>'
          );
        }).join('') +
      '</div>'
    )
    : '<div style="background:var(--danger-soft); border:1px solid var(--danger-border); border-radius:12px; padding:16px 18px; font-size:13.5px; color:var(--text);">No customer selected yet — go back to Select Customer.</div>';

  var excludedNote = excludedCount > 0
    ? '<p style="font-size:12px; color:var(--text-tertiary); margin:10px 0 0 0;">' + excludedCount + ' item' + (excludedCount === 1 ? '' : 's') + ' not carried / no match are excluded from the quotation.</p>'
    : '';

  var nameHintNote = (corrected.length > 0 && !(state.contributorName || '').trim())
    ? '<p style="font-size:12px; color:var(--text-tertiary); margin:10px 0 0 0;">Set your name from the menu under your avatar (top right) so corrections you export are attributed to you.</p>'
    : '';

  return (
    '<div style="margin-bottom:22px;">' +
      '<h1 style="font-size:22px; font-weight:800; margin:0 0 6px 0; letter-spacing:-0.01em;">Generate quotation</h1>' +
      '<p style="font-size:14px; color:var(--text-secondary); margin:0;">Review everything below, then generate the filled-in quotation Excel file.</p>' +
    '</div>' +

    '<div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:24px;">' +
      '<div><h2 style="font-size:13px; font-weight:700; color:var(--text-tertiary); text-transform:uppercase; letter-spacing:0.03em; margin:0 0 10px 0;">' + (selectedCustomers.length > 1 ? 'Customers (' + selectedCustomers.length + ')' : 'Customer') + '</h2>' + customerCard + '</div>' +
      '<div><h2 style="font-size:13px; font-weight:700; color:var(--text-tertiary); text-transform:uppercase; letter-spacing:0.03em; margin:0 0 10px 0;">Comment</h2>' +
        '<div style="background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px 20px; font-size:13px; color:var(--text-secondary); min-height:60px; white-space:pre-wrap;">' + (state.comment ? escapeHtml(state.comment) : '<span style="color:var(--text-tertiary); font-style:italic;">No comment added.</span>') + '</div>' +
      '</div>' +
    '</div>' +

    '<h2 style="font-size:13px; font-weight:700; color:var(--text-tertiary); text-transform:uppercase; letter-spacing:0.03em; margin:0 0 10px 0;">Line items (' + lineItems.length + ')</h2>' +
    '<div style="background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; margin-bottom:6px;">' +
      '<table><thead><tr style="background:var(--surface-2);"><th style="padding-top:14px;">Model</th><th style="padding-top:14px;">Product Name</th><th style="padding-top:14px; text-align:right;">Qty</th></tr></thead>' +
      '<tbody>' + lineItemsHtml + '</tbody></table>' +
    '</div>' +
    (selectedCustomers.length > 1
      ? '<p style="font-size:12px; color:var(--text-tertiary); margin:10px 0 0 0;">Each of the ' + selectedCustomers.length + ' selected customers gets its own copy of these ' + lineItems.length + ' line item' + (lineItems.length === 1 ? '' : 's') + ' in the generated file, as a separate quotation.</p>'
      : '') +
    excludedNote + nameHintNote +

    '<div style="display:flex; justify-content:space-between; align-items:center; margin-top:36px; padding-top:28px; border-top:1px solid var(--border);">' +
      '<button class="btn-prev" data-action="prev-step"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>Previous</button>' +
      '<div style="display:flex; align-items:center; gap:12px;">' +
        '<button class="btn-clear" data-action="clear-all"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>Clear quotation &amp; start over</button>' +
        (corrected.length > 0
          ? '<button class="btn-export" data-action="export-corrections">Export corrections (' + corrected.length + ')</button>'
          : '') +
        '<button class="btn-primary" data-action="download-quotation" ' + (canGenerate ? '' : 'disabled') + '><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="m7 10 5 5 5-5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></svg>Download Quotation</button>' +
      '</div>' +
    '</div>'
  );
}

/* =========================================================================
   RENDER DISPATCH + FOCUS PRESERVATION
   ========================================================================= */
var root = document.getElementById('root');

function currentStepHtml() {
  switch (state.step) {
    case 1: return renderStep1();
    case 2: return renderStep2();
    case 3: return renderStep3();
    case 4: return renderStep4();
    case 5: return renderStep5();
    default: return renderStep1();
  }
}

function render() {
  var active = document.activeElement;
  var focusInfo = null;
  // Preserve focus across the full re-render below. Most inputs are identified
  // by a stable id (customerSearchInput, commentBox, ...), but per-row inputs
  // like the review-page product search (.item-search-input) only have a
  // class + data-id — requiring `active.id` here used to skip capture for
  // those entirely, which is why that search box lost focus on every
  // keystroke. Capture on id OR class so both kinds of input survive.
  if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA') && (active.id || active.className)) {
    focusInfo = { id: active.id, selStart: active.selectionStart, selEnd: active.selectionEnd, cls: active.className, dataId: active.getAttribute('data-id') };
  }

  root.innerHTML = renderShell(currentStepHtml());

  // One-shot autofocus request: e.g. right after opening a review item's search
  // panel, so the user can start typing immediately without clicking into it.
  // Consumed (cleared) here every render regardless of whether the element was
  // found, so it never lingers and fires on some unrelated later render.
  if (state.pendingFocusId) {
    var pendingEl = document.querySelector('.item-search-input[data-id="' + CSS.escape(state.pendingFocusId) + '"]');
    if (pendingEl) {
      pendingEl.focus();
      // Select any pre-filled guess text (see guessSearchQuery()) so typing
      // immediately replaces it in one go, if the guess isn't close enough —
      // no separate click-and-clear step needed first.
      try { pendingEl.select(); } catch (e) { /* ignore */ }
    }
    state.pendingFocusId = null;
  }

  if (focusInfo) {
    var el = null;
    if (focusInfo.id) {
      var candidates = document.querySelectorAll('#' + CSS.escape(focusInfo.id));
      if (focusInfo.dataId) {
        for (var i = 0; i < candidates.length; i++) { if (candidates[i].getAttribute('data-id') === focusInfo.dataId) { el = candidates[i]; break; } }
      } else if (candidates.length) {
        el = candidates[0];
      }
    }
    if (!el && focusInfo.cls) {
      var byClass = document.querySelectorAll('.' + focusInfo.cls.split(' ')[0]);
      if (focusInfo.dataId) {
        for (var j = 0; j < byClass.length; j++) { if (byClass[j].getAttribute('data-id') === focusInfo.dataId) { el = byClass[j]; break; } }
      }
    }
    if (el) {
      el.focus();
      try { el.setSelectionRange(focusInfo.selStart, focusInfo.selEnd); } catch (e) { /* ignore */ }
    }
  }
}

/* =========================================================================
   ACTIONS
   ========================================================================= */
function goNext() {
  if (state.step === 1 && state.items.length === 0) return;
  if (state.step === 2 && state.selectedCustomerCodes.length === 0) return;
  if (state.step === 3) {
    var attention = state.items.filter(function (i) { return i.status === 'review' || i.status === 'nomatch'; }).length;
    if (attention > 0) return;
  }
  state.step = Math.min(5, state.step + 1);
}
function goPrev() { state.step = Math.max(1, state.step - 1); }

function describeOriginalMatch(it) {
  if (it.originalStatus === 'matched') {
    var p = productByModel(it.originalMatchedSku);
    return 'Matched to ' + (it.originalMatchedSku || '?') + (p ? (' (' + p.name + ')') : '');
  }
  if (it.originalStatus === 'review') {
    var p2 = productByModel(it.originalMatchedSku);
    return 'Flagged for review' + (p2 ? (' — candidate: ' + it.originalMatchedSku + ' (' + p2.name + ')') : ' — no candidate');
  }
  return 'No match';
}

function mdEscape(s) {
  return String(s == null ? '' : s).replace(/\|/g, '\\|').replace(/\n/g, ' ');
}

// Saves a file to the viewer. Uses the Claude artifact "downloads" capability
// when this page is running inside claude.ai's artifact viewer; otherwise falls
// back to a plain browser download (Blob + a hidden <a download> click), which
// works when this same HTML file is opened directly — e.g. emailed, put on a
// shared drive, or hosted anywhere else outside Claude. This is what lets the
// app be distributed as a standalone file when the artifact itself can't be
// shared publicly (claude.ai disallows public sharing for any artifact that
// offers file downloads via the capability).
function saveFile(filename, data, mimeType) {
  if (typeof window.claude !== 'undefined' && window.claude.downloads) {
    return window.claude.downloads.save({ filename: filename, data: data });
  }
  return new Promise(function (resolve, reject) {
    try {
      var blob = (data instanceof Blob) ? data : new Blob([data], { type: mimeType || 'application/octet-stream' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      resolve({ status: 'saved' });
    } catch (e) {
      reject(e);
    }
  });
}

function doExportCorrections() {
  var corrected = getCorrectedItems();
  if (corrected.length === 0) return;
  var contributor = (state.contributorName || '').trim() || '(not provided)';
  var lines = [
    '| Contributed By | Date | Source Spec | Spec Item Description (as written) | Qty | UOM | Auto-Match Attempt | Correct Product Name | Correct Model/SKU | Notes |',
    '|---|---|---|---|---|---|---|---|---|---|'
  ];
  corrected.forEach(function (it) {
    var finalProduct = productByModel(it.matchedSku);
    var finalName = it.status === 'not_carried' ? 'Not carried' : (finalProduct ? finalProduct.name : (it.matchedSku || ''));
    var finalModel = it.status === 'not_carried' ? 'N/A' : (it.matchedSku || '');
    lines.push('| ' + [
      mdEscape(contributor), mdEscape(todayStr()), mdEscape(state.sourceFileName || ''),
      mdEscape(it.description), mdEscape(it.qty), mdEscape(it.uom),
      mdEscape(describeOriginalMatch(it)), mdEscape(finalName), mdEscape(finalModel), mdEscape(it.note)
    ].join(' | ') + ' |');
  });
  var md = lines.join('\n') + '\n';
  var filename = 'review_corrections_' + todayStr() + '.md';
  saveFile(filename, md, 'text/markdown').then(function () {
    state.toast = 'Downloaded ' + filename + ' — ' + corrected.length + ' corrected item' + (corrected.length === 1 ? '' : 's') + '. Send it to your admin to compile into the skill.';
    render();
  }).catch(function (err) {
    if (err && err.code === 'declined') return;
    state.toast = 'Could not export corrections (' + (err && err.code || 'unknown error') + ').';
    render();
  });
}

function doDownloadQuotation() {
  var customers = getSelectedCustomers();
  if (customers.length === 0) return;
  var lineItems = computeLineItems();
  if (lineItems.length === 0) return;

  var header = ['Row No.* (Important)', 'First Name*', 'Last Name', 'Email*', 'Order Type*', 'Shipping Phone No.*', 'Shipping Company', 'Shipping Address Line 1*', 'Shipping Address Line 2', 'Shipping Postcode*', 'Shipping City*', 'Shipping State*', 'Shipping Country*', 'Currency', 'Shipping Method*', 'Model*', 'Product Name', 'Quantity*', 'Unit Price ', 'Quotation Status', 'Comment'];
  var rows = [header];
  // Row No. is what GOH's import system groups into one quotation per value —
  // so every customer gets their own Row No. (1-based, in selection order),
  // and every line item is duplicated under it. One item selected for two
  // customers becomes two rows here: Row No. 1 for the first customer, Row
  // No. 2 for the second, each carrying the same item.
  customers.forEach(function (c, customerIdx) {
    var rowNo = customerIdx + 1;
    lineItems.forEach(function (li) {
      rows.push([
        rowNo, c.contactFirstName || c.name, '', c.email || '', 'Order and Deliver', c.phone || '', c.name,
        c.address || '', c.address2 || '', c.postcode || '', c.city || '', c.state || '', c.country || 'Malaysia',
        'MYR', 'GOS Shipping', li.model, '', li.qty, li.price3, 'Pending', state.comment || ''
      ]);
    });
  });

  var bytes = window.buildXlsx(rows, 'quotation_template');
  var safeName;
  if (customers.length === 1) {
    safeName = String(customers[0].name).replace(/[^A-Za-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 40) || 'customer';
  } else {
    safeName = customers.length + '_customers';
  }
  var filename = 'Quotation_' + safeName + '_' + todayStr() + '.xlsx';

  saveFile(filename, bytes, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet').then(function () {
    state.toast = 'Downloaded ' + filename + ' — ' + customers.length + ' quotation' + (customers.length === 1 ? '' : 's') + ' (Row No. 1' + (customers.length > 1 ? '–' + customers.length : '') + ').';
    render();
  }).catch(function (err) {
    if (err && err.code === 'declined') return;
    state.toast = 'Could not generate the quotation file (' + (err && err.code || 'unknown error') + ').';
    render();
  });
}

function resetAll() {
  var keepName = state.contributorName;
  state.step = 1;
  state.items = [];
  state.sourceFileName = '';
  state.importError = '';
  state.selectedCustomerCodes = [];
  state.customerSearch = '';
  state.customerPage = 1;
  state.reviewSortMode = 'status';
  state.reviewSortOrder = [];
  state.reviewSearch = '';
  state.reviewPage = 1;
  state.pendingFocusId = null;
  state.comment = '';
  state.toast = '';
  state.fileDragActive = false;
  state.contributorName = keepName;
}

function handleImportFile(file) {
  var reader = new FileReader();
  reader.onload = function () {
    try {
      var data = JSON.parse(reader.result);
      if (!Array.isArray(data)) throw new Error('Expected a JSON array of items, got ' + typeof data + '.');
      if (data.length === 0) throw new Error('That file has no items in it.');
      var required = ['rowId', 'description', 'qty', 'uom', 'status'];
      var validStatuses = { matched: 1, review: 1, nomatch: 1 };
      data.forEach(function (row, i) {
        required.forEach(function (key) {
          if (!(key in row)) throw new Error('Row ' + (i + 1) + ' is missing "' + key + '".');
        });
        if (!validStatuses[row.status]) {
          throw new Error('Row ' + (i + 1) + ' has status "' + row.status + '" — expected matched, review, or nomatch.');
        }
      });
      loadItems(data, file.name);
    } catch (err) {
      state.importError = err.message;
    }
    render();
  };
  reader.onerror = function () { state.importError = 'Could not read that file.'; render(); };
  reader.readAsText(file);
}

/* =========================================================================
   EVENT WIRING (delegated — content is re-rendered wholesale on every change)
   ========================================================================= */
root.addEventListener('click', function (e) {
  var el = e.target.closest('[data-action]');
  if (!el) return;
  var action = el.getAttribute('data-action');
  var id = el.getAttribute('data-id');

  switch (action) {
    case 'trigger-file-input': {
      var input = document.getElementById('extractedItemsInput');
      if (input) input.click();
      return; // no render needed
    }
    case 'load-sample':
      loadItems(sampleItems(), '05_Spesifikasi.pdf (sample)');
      break;
    case 'goto-step':
      state.step = parseInt(el.getAttribute('data-step'), 10);
      break;
    case 'next-step': goNext(); break;
    case 'prev-step': goPrev(); break;
    case 'select-customer': {
      var toggleCode = el.getAttribute('data-code');
      var existingIdx = state.selectedCustomerCodes.indexOf(toggleCode);
      if (existingIdx === -1) state.selectedCustomerCodes.push(toggleCode);
      else state.selectedCustomerCodes.splice(existingIdx, 1);
      break;
    }
    case 'remove-customer': {
      var removeCode = el.getAttribute('data-code');
      var removeIdx = state.selectedCustomerCodes.indexOf(removeCode);
      if (removeIdx !== -1) state.selectedCustomerCodes.splice(removeIdx, 1);
      break;
    }
    case 'customer-prev-page': state.customerPage = Math.max(1, state.customerPage - 1); break;
    case 'customer-next-page': {
      var totalPages = Math.max(1, Math.ceil(filterCustomers(state.customerSearch).length / state.customerPageSize));
      state.customerPage = Math.min(totalPages, state.customerPage + 1);
      break;
    }
    case 'set-sort':
      state.reviewSortMode = el.getAttribute('data-mode');
      recomputeSortOrder();
      state.reviewPage = 1;
      break;
    case 'review-prev-page': state.reviewPage = Math.max(1, state.reviewPage - 1); break;
    case 'review-next-page': {
      var reviewQuery = (state.reviewSearch || '').trim();
      var filteredReviewCount = reviewQuery
        ? state.items.filter(function (i) { return reviewItemMatchesQuery(i, reviewQuery); }).length
        : state.items.length;
      var totalReviewPages = Math.max(1, Math.ceil(filteredReviewCount / state.reviewPageSize));
      state.reviewPage = Math.min(totalReviewPages, state.reviewPage + 1);
      break;
    }
    case 'clear-review-search':
      state.reviewSearch = '';
      state.reviewPage = 1;
      break;
    case 'toggle-open': {
      var it = itemById(id);
      if (it) {
        it.open = !it.open;
        // Pre-fill the search box with a cleaned-up guess from the item's own
        // extracted description, so relevant candidates show up immediately
        // without the user having to type anything first — see
        // guessSearchQuery(). Also autofocus the box (and select the pre-filled
        // text) so the user can start typing right away to override the guess
        // if it's not close enough, without an extra click-and-clear step.
        // render() consumes the pendingFocusId flag once, right after using it.
        if (it.open) { it.query = guessSearchQuery(it); state.pendingFocusId = it.id; }
        else { state.pendingFocusId = null; }
      }
      break;
    }
    case 'cancel-open': {
      var it2 = itemById(id);
      if (it2) it2.open = false;
      break;
    }
    case 'pick-result': {
      var it3 = itemById(id);
      var model = el.getAttribute('data-model');
      if (it3) { it3.matchedSku = model; it3.status = 'matched'; it3.open = false; it3.note = ''; }
      break;
    }
    case 'confirm-candidate': {
      var it5 = itemById(id);
      if (it5) { it5.status = 'matched'; it5.open = false; }
      break;
    }
    case 'mark-not-carried': {
      var it4 = itemById(id);
      if (it4) { it4.status = 'not_carried'; it4.matchedSku = null; it4.open = false; }
      break;
    }
    case 'export-corrections': doExportCorrections(); return;
    case 'download-quotation': doDownloadQuotation(); return;
    case 'clear-all': resetAll(); break;
    case 'dismiss-toast': state.toast = ''; break;
    case 'toggle-user-menu': state.userMenuOpen = !state.userMenuOpen; break;
    case 'close-user-menu': state.userMenuOpen = false; break;
    default: return;
  }
  render();
});

root.addEventListener('input', function (e) {
  var t = e.target;
  if (t.id === 'customerSearchInput') {
    state.customerSearch = t.value;
    state.customerPage = 1;
    render();
  } else if (t.id === 'reviewSearchInput') {
    state.reviewSearch = t.value;
    state.reviewPage = 1;
    render();
  } else if (t.id === 'commentBox') {
    state.comment = t.value;
    render();
  } else if (t.id === 'userMenuNameInput') {
    state.contributorName = t.value;
    saveStoredContributorName(t.value);
    render();
  } else if (t.classList.contains('item-search-input')) {
    var it = itemById(t.getAttribute('data-id'));
    if (it) { it.query = t.value; render(); }
  }
});

root.addEventListener('change', function (e) {
  if (e.target.id === 'extractedItemsInput') {
    var file = e.target.files && e.target.files[0];
    if (file) handleImportFile(file);
  }
});

/* =========================================================================
   DRAG & DROP — extracted_items.json onto the Step 1 dropzone
   ========================================================================= */
// Without this, dragging a file anywhere over the page and missing the
// dropzone makes the browser navigate to / render the raw file, replacing
// the whole app. Always prevent default at the document level regardless
// of drop target; the dropzone-specific handling below runs first during
// the bubble phase and does the actual import.
document.addEventListener('dragover', function (e) { e.preventDefault(); });
document.addEventListener('drop', function (e) { e.preventDefault(); });

root.addEventListener('dragenter', function (e) {
  if (e.target && e.target.id === 'dropzone' && !state.fileDragActive) {
    state.fileDragActive = true;
    render();
  }
});
root.addEventListener('dragleave', function (e) {
  if (e.target && e.target.id === 'dropzone' && state.fileDragActive) {
    state.fileDragActive = false;
    render();
  }
});
root.addEventListener('drop', function (e) {
  if (!(e.target && e.target.id === 'dropzone')) return;
  e.preventDefault();
  state.fileDragActive = false;
  var file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (file) {
    handleImportFile(file);
  } else {
    state.importError = 'Could not read the dropped file — try Browse files instead.';
    render();
  }
});

/* =========================================================================
   BOOT
   ========================================================================= */
render();
</script>
</body>
</html>
